<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
  <title id="title">Icon Marquee</title>
  <desc id="description">A blue pixel heart moving through staggered rows of icon-sized blocks.</desc>
  <style>
    .trail { fill: #182344 }
    .soft { opacity: .28 }
    .mid { opacity: .56 }
    .heart { fill: #345fe9 }
    @media (prefers-color-scheme: dark) { .trail { fill: #ece7dc } }
  </style>
  <g class="trail">
    <rect class="soft" x="12" y="18" width="14" height="12"/>
    <rect class="mid" x="38" y="18" width="36" height="12"/>
    <rect x="86" y="18" width="52" height="12"/>

    <rect class="soft" x="20" y="42" width="24" height="12"/>
    <rect class="mid" x="56" y="42" width="48" height="12"/>
    <rect x="116" y="42" width="36" height="12"/>

    <rect class="soft" x="12" y="66" width="14" height="12"/>
    <rect class="mid" x="38" y="66" width="36" height="12"/>
    <rect x="86" y="66" width="52" height="12"/>

    <rect x="248" y="18" width="36" height="12"/>
    <rect class="mid" x="296" y="18" width="52" height="12"/>
    <rect class="soft" x="360" y="18" width="28" height="12"/>

    <rect x="248" y="42" width="52" height="12"/>
    <rect class="mid" x="312" y="42" width="48" height="12"/>
    <rect class="soft" x="372" y="42" width="16" height="12"/>

    <rect x="248" y="66" width="36" height="12"/>
    <rect class="mid" x="296" y="66" width="52" height="12"/>
    <rect class="soft" x="360" y="66" width="28" height="12"/>
  </g>
  <g class="heart" transform="translate(170 24) scale(12)">
    <rect x="1" y="0" width="1" height="1"/>
    <rect x="3" y="0" width="1" height="1"/>
    <rect x="0" y="1" width="1" height="1"/>
    <rect x="2" y="1" width="1" height="1"/>
    <rect x="4" y="1" width="1" height="1"/>
    <rect x="1" y="2" width="1" height="1"/>
    <rect x="3" y="2" width="1" height="1"/>
    <rect x="2" y="3" width="1" height="1"/>
  </g>
</svg>
