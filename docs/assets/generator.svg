<svg xmlns="http://www.w3.org/2000/svg" width="360" height="88" viewBox="0 0 360 88" role="img" aria-labelledby="cta-title">
<title id="cta-title">Open the Icon Marquee generator</title>
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#eef1f7"/><stop offset=".5" stop-color="#d3dae6"/><stop offset="1" stop-color="#f3f5fa"/></linearGradient>
  <linearGradient id="metal-dark" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#303947"/><stop offset=".45" stop-color="#1b2432"/><stop offset=".5" stop-color="#111722"/><stop offset="1" stop-color="#252f40"/></linearGradient>
  <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="edge"><rect x="1" y="1" width="358" height="86" rx="18"/></clipPath>
</defs>
<style>
.shell{fill:url(#metal);stroke:#bdc7d7}.ink{fill:#18263e}.muted{fill:#566783}.rule{stroke:#b9c5d8}.wave{stroke:#365bed}.glint{animation:pass 7s ease-in-out infinite}
@media(prefers-color-scheme:dark){.shell{fill:url(#metal-dark);stroke:#455269}.ink{fill:#f3f6fd}.muted{fill:#a4b4cc}.rule{stroke:#4a5971}.wave{stroke:#9ab3ff}}
@keyframes pass{0%,55%{transform:translateX(-130px)}90%,100%{transform:translateX(400px)}}
@media(prefers-reduced-motion:reduce){.glint{display:none}}
</style>
<rect class="shell" x="1" y="1" width="358" height="86" rx="18"/>
<path class="wave" d="M23 32q12-12 24 0t24 0M23 44q12-12 24 0t24 0M23 56q12-12 24 0t24 0" fill="none" stroke-width="4" stroke-linecap="round"/>
<path class="rule" d="M91 20v48" fill="none"/>
<g font-family="Segoe UI,Arial,sans-serif"><text class="muted" x="110" y="32" font-size="12" font-weight="500">Make your stack move</text><text class="ink" x="109" y="61" font-size="23" font-weight="650">Open generator</text></g>
<path class="wave" d="M320 38l7 6-7 6m-11-6h17" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g clip-path="url(#edge)" pointer-events="none"><path class="glint" d="M0 0h70L25 88h-70z" fill="url(#shine)"/></g>
</svg>
